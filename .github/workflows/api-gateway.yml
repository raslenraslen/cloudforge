name: api-gateway

on:
  push:
    branches: ["main"]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway.yml"
      - "pom.xml"   # parent POM of this service
  pull_request:
    branches: ["main"]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway.yml"
      - "pom.xml"   # parent POM of this service

env:
  SERVICE_DIR: api-gateway
  IMAGE: raslenmissaoui061/cloudforgeapigateway
  NAMESPACE: cloudforge
  SONAR_HOST_URL: http://192.168.216.131:9000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Build (tests skipped)
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn -B clean package -DskipTests

  trivy-fs:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies for vulnerabilities
        run: trivy fs --scanners vuln --format table --output trivy-fs-report.txt "$SERVICE_DIR"
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt

  sonarqube:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: ${{ env.SERVICE_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  docker:
    if: github.event_name == 'push'
    runs-on: self-hosted
    needs: [trivy-fs, sonarqube]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: raslenmissaoui061
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push (tagged with the commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    runs-on: self-hosted
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Apply the manifest and roll out the new image
        run: |
          kubectl apply -f k8s/pipeline/api-gateway.yml -n "$NAMESPACE"
          kubectl set image deployment/api-gateway "api-gateway=$IMAGE:${{ github.sha }}" -n "$NAMESPACE"
          kubectl rollout status deployment/api-gateway -n "$NAMESPACE" --timeout=600s

  notify:
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, trivy-fs, sonarqube, docker, deploy]
    steps:
      - name: Send the result to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: |
          if [ "$FAILED" = "true" ]; then status="failed"; else status="succeeded"; fi
          message="**api-gateway** $status on \`${{ github.ref_name }}\` by ${{ github.actor }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -H "Content-Type: application/json" -X POST \
            -d "$(jq -n --arg content "$message" '{content: $content}')" "$DISCORD_WEBHOOK"
