name: notification-service

on:
  push:
    branches: ["main"]
    paths:
      - "notification-service/**"
      - ".github/workflows/notification-service.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "notification-service/**"
      - ".github/workflows/notification-service.yml"

# id-token lets the runner log in to Vault with GitHub's OIDC token (JWT auth),
# so no Vault credential is stored in GitHub.
permissions:
  id-token: write
  contents: read

env:
  SERVICE_DIR: notification-service
  SONAR_HOST_URL: http://192.168.216.131:9000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Build (tests skipped)
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn -B clean package -DskipTests

  trivy-fs:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies for vulnerabilities
        run: trivy fs --scanners vuln --format table --output trivy-fs-report.txt "$SERVICE_DIR"
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt

  sonarqube:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the Sonar token from Vault
        id: vault
        uses: hashicorp/vault-action@v2
        with:
          url: http://192.168.216.131:32441
          method: jwt
          role: notification-service-role
          secrets: |
            secret/data/ci/notification-service SONAR_TOKEN | SONAR_TOKEN
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: ${{ env.SERVICE_DIR }}
        env:
          SONAR_TOKEN: ${{ steps.vault.outputs.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  notify:
    if: always() && github.event_name == 'push'
    runs-on: self-hosted
    needs: [build, trivy-fs, sonarqube]
    steps:
      - name: Read the Discord webhook from Vault
        id: vault
        uses: hashicorp/vault-action@v2
        with:
          url: http://192.168.216.131:32441
          method: jwt
          role: notification-service-role
          secrets: |
            secret/data/ci/notification-service DISCORD_WEBHOOK | DISCORD_WEBHOOK
      - name: Send the result to Discord
        env:
          DISCORD_WEBHOOK: ${{ steps.vault.outputs.DISCORD_WEBHOOK }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: |
          if [ "$FAILED" = "true" ]; then status="failed"; else status="succeeded"; fi
          message="**notification-service** $status on \`${{ github.ref_name }}\` by ${{ github.actor }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -H "Content-Type: application/json" -X POST \
            -d "$(jq -n --arg content "$message" '{content: $content}')" "$DISCORD_WEBHOOK"
