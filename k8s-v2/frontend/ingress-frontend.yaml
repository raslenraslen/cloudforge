apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudforgeingress
  namespace: cloudforge-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:

  ingressClassName: nginx

  rules:
  - host: "cloudforge-frontend.local"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
